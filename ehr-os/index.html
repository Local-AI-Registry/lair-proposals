<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAIR OS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Cormorant:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --blue:#1F4FE0;--blue-700:#1A3FB8;--blue-400:#5B7DF0;--tint:#E7EDFC;
  --ink:#0B1A2E;--ink-600:#556070;--ink-400:#8E9AAB;
  --coral:#FF5A3C;--coral-tint:#FFE6E0;--paper:#F4F1EA;--deep:#ECE6D6;
  --hair:rgba(11,26,46,.09);--hair-2:rgba(11,26,46,.16);
  --lift:0 10px 32px rgba(11,26,46,.12),0 2px 6px rgba(11,26,46,.05);
  --ease:cubic-bezier(.2,.6,.2,1);
  --display:'Cormorant',serif;--loud:'Bricolage Grotesque',sans-serif;--body:'Hanken Grotesk',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E4EAF6;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#map{position:fixed;inset:0}
.float{position:fixed;background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--lift)}

/* Left column */
#left{position:fixed;left:20px;top:20px;bottom:20px;width:420px;display:flex;flex-direction:column;gap:10px;z-index:5;pointer-events:none}
#left>*{pointer-events:auto}
.brandbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hair);border-radius:14px;padding:7px 8px 7px 12px;box-shadow:var(--lift)}
.brandbar b{font-family:var(--loud);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brandbar .prac{color:var(--ink-600);font-size:13px;border-left:1px solid var(--hair-2);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbar .sp{flex:1}
.ibtn{position:relative;height:34px;min-width:34px;padding:0 9px;border-radius:10px;border:1px solid var(--hair);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-600)}
.ibtn:hover{border-color:var(--hair-2);color:var(--ink)}
.ibtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.badge:empty{display:none}
.searchbox{position:relative}
.sb{display:flex;align-items:center;gap:8px;height:54px;padding:0 8px 0 16px;background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:var(--lift)}
.sb:focus-within{border-color:var(--blue);box-shadow:var(--lift),0 0 0 4px rgba(31,79,224,.12)}
.sb input{flex:1;border:0;outline:0;font-size:15.5px;background:transparent;min-width:0}
.sb input::placeholder{color:var(--ink-400)}
.kbd{font-family:var(--loud);font-size:11px;font-weight:600;color:var(--ink-400);border:1px solid var(--hair-2);border-radius:6px;padding:0 6px}
.send{width:38px;height:38px;border-radius:11px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.send:hover{background:var(--blue-700)}
.send:disabled{opacity:.4;cursor:default}
.mic{width:38px;height:38px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-600)}
.mic:hover{background:var(--paper)}
#ta{position:absolute;left:0;right:0;top:60px;background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:var(--lift);padding:6px;display:none;z-index:3;max-height:380px;overflow:auto}
#ta.on{display:block}
.ta-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.ta-row:hover,.ta-row.sel{background:var(--paper)}
.ta-row img{width:32px;height:32px;border-radius:50%}
.ta-ic{width:32px;height:32px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--blue);flex:0 0 auto;font-size:14px}
.ta-label{font-size:11px;font-family:var(--loud);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-400);padding:8px 10px 4px}
.ta-row small{color:var(--ink-600)}
#thread{flex:0 1 auto;min-height:0;overflow:auto;background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--lift);padding:18px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:8px;animation:rise 300ms var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-items:flex-end}
.bubble-u{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 14px;max-width:85%;word-wrap:break-word;overflow-wrap:anywhere}
.agent{display:flex;align-items:center;gap:8px;font-family:var(--loud);font-weight:700;font-size:11.5px;letter-spacing:.08em;color:var(--blue)}
.agent i{width:22px;height:22px;border-radius:7px;background:var(--tint);display:grid;place-items:center;font-style:normal;font-size:12px}
.agent .when{margin-left:auto;font-family:var(--body);font-weight:500;letter-spacing:0;color:var(--ink-400)}
.msg.nudge{border:1px solid rgba(255,90,60,.35);background:#FFFBFA;border-radius:16px;padding:12px 14px}
.msg.nudge .agent{color:#C2381E}
.msg.nudge .agent i{background:var(--coral-tint)}
.msg.resolved{opacity:.55}
.steps{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-600)}
.step{display:flex;align-items:center;gap:8px}
.step .ck{width:15px;height:15px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.step .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--tint);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.text{font-size:14.5px;line-height:1.55}
.hello{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.05;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-ask{border:1px solid var(--hair-2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip-ask img{width:20px;height:20px;border-radius:50%;margin-left:-4px}
.chip-ask:hover{border-color:var(--blue);background:var(--tint);color:var(--blue-700)}
.cardx{border:1px solid var(--hair);border-radius:14px;padding:12px 14px;background:#fff}
.cardx h4{margin:0 0 4px;font-family:var(--loud);font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cardx h4 small{font-family:var(--body);font-weight:500;color:var(--ink-600);font-size:12px}
.cardx + .cardx{margin-top:8px}
.rowx{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hair)}
.cardx h4 + .rowx{border-top:0}
.rowx.click{cursor:pointer;border-radius:10px;margin:0 -6px;padding:8px 6px}
.rowx.click:hover{background:var(--paper)}
.rowx img,.rowx .av0{width:32px;height:32px;border-radius:50%;flex:0 0 auto}
.av0{background:var(--paper);display:grid;place-items:center;font-family:var(--loud);font-weight:700;font-size:11px;color:var(--ink-600)}
.rowx .g{flex:1;min-width:0}
.rowx .g b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx small{color:var(--ink-600);font-size:12px;line-height:1.35;display:block}
.rowx .t{font-family:var(--loud);font-weight:700;font-size:12.5px;width:44px;flex:0 0 auto;color:var(--ink-600)}
.rowx.past{opacity:.5}
.num{font-family:var(--loud);font-weight:800;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border-radius:12px;padding:10px 12px}
.stat .num{font-size:21px}
.stat small{display:block;color:var(--ink-600);font-size:11.5px;margin-top:4px;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:11px;border:0;background:var(--blue);color:#fff;font-family:var(--loud);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-700)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--hair-2)}
.btn.ghost:hover{border-color:rgba(11,26,46,.3)}
.btn.danger{background:#C2381E}.btn.danger:hover{background:#A8321C}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--deep);color:#3D4757;white-space:nowrap}
.tag.blue{background:var(--tint);color:var(--blue-700)}
.tag.coral{background:var(--coral-tint);color:#A8321C}
.tag.ink{background:var(--ink);color:#fff}
.bar{height:6px;background:var(--paper);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.draft{width:100%;min-height:76px;border:1px solid var(--hair-2);border-radius:12px;padding:10px 12px;resize:vertical;font-size:14px;line-height:1.5;background:var(--paper)}
.draft:focus{outline:none;border-color:var(--blue);background:#fff}
.meta{font-size:12px;color:var(--ink-600)}
.warn{background:var(--coral-tint);color:#8F2A17;border-radius:12px;padding:10px 12px;font-size:13px}
.ok{background:var(--tint);color:var(--blue-700);border-radius:12px;padding:10px 12px;font-size:13px}

/* Up next */
#next{position:fixed;top:20px;left:calc(50% + 50px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:999px;z-index:4;cursor:pointer;max-width:calc(100vw - 900px);border:1px solid var(--hair)}
#next img{width:34px;height:34px;border-radius:50%}
#next .lbl{font-family:var(--loud);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--blue);text-transform:uppercase}
#next .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#next .in{font-family:var(--loud);font-weight:700;font-size:12px;background:var(--tint);color:var(--blue-700);border-radius:999px;padding:3px 10px;white-space:nowrap}
#next .in.soon{background:var(--coral-tint);color:#A8321C}
#next:hover{border-color:var(--hair-2)}
#clock{font-size:11px;color:var(--ink-400);white-space:nowrap;padding-right:6px}

/* Map controls */
#mapctl{position:fixed;right:20px;top:72px;width:290px;padding:12px 14px;z-index:4;max-height:calc(100vh - 150px);overflow:auto}
.flabel{font-size:11.5px;font-weight:600;color:var(--ink-600);margin:8px 0 4px}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.fc{border:1px solid var(--hair-2);background:#fff;border-radius:999px;height:28px;padding:0 8px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-600)}
.fc:hover{border-color:var(--blue);color:var(--blue-700)}
.fc.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fres{background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12.5px;color:var(--ink-600)}
.fres .num{font-size:22px;color:var(--ink)}
.fres .row2{display:flex;gap:12px;margin:6px 0 8px}
.fres .row2 b{color:var(--ink);font-family:var(--loud)}
.fres .btns{margin-top:4px}
.lgd{display:flex;gap:14px;font-size:12px;color:var(--ink-600);margin-top:10px}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#mapctl h5{margin:0 0 8px;font-family:var(--loud);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-600);display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;height:30px;border-radius:8px;font-family:var(--loud);font-weight:600;font-size:12px;color:var(--ink-600);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,26,46,.1)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;cursor:pointer;user-select:none}
.tog input{accent-color:var(--blue);width:16px;height:16px}
.tog i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:auto}
.ramp{height:8px;border-radius:99px;background:linear-gradient(90deg,#F9F9FB,#E8EDFB,#CDD8F8,#A0B6F3);margin-top:4px}
.ramp-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-600);margin-top:3px}
.zoomrow{display:flex;gap:6px;margin-top:10px}
.zoomrow button{flex:1;height:32px;border-radius:9px;border:1px solid var(--hair);background:#fff;cursor:pointer;font-family:var(--loud);font-weight:700}
.zoomrow button:hover{border-color:var(--hair-2)}
#mapctl.min .body{display:none}
#mapctl.min{width:auto}

/* Today rail */
#rail{position:fixed;bottom:20px;left:calc(50% + 225px);transform:translateX(-50%);display:flex;align-items:stretch;gap:4px;padding:8px;border-radius:18px;z-index:4;max-width:calc(100vw - 500px);overflow-x:auto}
#rail .rl2{display:flex;flex-direction:column;justify-content:center;padding:0 12px 0 6px;border-right:1px solid var(--hair);margin-right:4px;white-space:nowrap}#rail .rl2 b{font-family:var(--loud);font-size:13px}#rail .rl2 span{font-size:12px;color:var(--ink-600)}#rail .rl2 small{font-size:10.5px;color:var(--ink-400)}
#rail .rl{font-family:var(--loud);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-600);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;padding:0 2px;border-right:1px solid var(--hair);margin-right:4px}
.ri{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:12px;cursor:pointer;border:0;background:transparent;min-width:62px;position:relative}
.ri:hover{background:var(--paper)}
.ri img,.ri .av0{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--hair-2)}
.ri .tt{font-family:var(--loud);font-weight:700;font-size:11.5px;white-space:nowrap}
.ri .nm{font-size:11px;color:var(--ink-600);max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri.past{opacity:.45}
.ri.now img,.ri.now .av0{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.ri.next img,.ri.next .av0{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--coral)}
.ri .flag{position:absolute;top:2px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.ri.noshow .tt{color:#C2381E}

/* Tooltip */
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.45;z-index:9;opacity:0;transition:opacity 120ms;max-width:280px}
#tip.on{opacity:1}
#tip .q{color:#AFC1F6}

/* EHR */
#ehr{position:fixed;right:20px;top:20px;bottom:20px;width:470px;z-index:6;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));transition:transform 360ms var(--ease)}
#ehr.on{transform:none}
.ehr-head{padding:18px 20px 0;display:flex;flex-direction:column;gap:10px}
.ehr-top{display:flex;gap:14px;align-items:center}
.ehr-top img{width:66px;height:66px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--hair-2)}
.ehr-name{font-family:var(--display);font-weight:500;font-size:32px;line-height:1;margin:0}
.ehr-sub{color:var(--ink-600);font-size:13px;margin-top:4px}
.x{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:10px;border:1px solid var(--hair);background:#fff;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);padding:0 16px;margin-top:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;height:42px;padding:0 11px;font-family:var(--loud);font-weight:600;font-size:13px;color:var(--ink-600);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--coral)}
.ehr-body{flex:1;overflow:auto;padding:16px 20px 22px;display:flex;flex-direction:column;gap:12px}
.sec{border:1px solid var(--hair);border-radius:14px;padding:12px 14px}
.sec h4{margin:0 0 6px;font-family:var(--loud);font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--hair);font-size:13.5px}
.sec h4 + .kv{border-top:0}
.kv span{color:var(--ink-600)}
.kv b{text-align:right;font-weight:600}
.alert{background:var(--coral-tint);color:#8F2A17;border-radius:12px;padding:9px 12px;font-size:13px}
.nba{background:var(--tint);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.nba p{margin:0}
.nba .big{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.1}
.tl{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--hair)}
.sec h4 + .tl{border-top:0}
.tl .ic{width:28px;height:28px;border-radius:8px;background:var(--paper);display:grid;place-items:center;flex:0 0 auto;color:var(--blue)}
.tl.search .ic{background:var(--coral-tint);color:var(--coral)}
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcard{border-radius:12px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:12px;min-height:92px;justify-content:space-between}
.soap p{margin:5px 0;font-size:13.5px}
.soap b{font-family:var(--loud);font-size:12px;letter-spacing:.08em;color:var(--blue)}

#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;pointer-events:none;transition:opacity 220ms,transform 220ms;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:30;transition:opacity 500ms}
#boot.off{opacity:0;pointer-events:none}
#boot div{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--loud);font-weight:700;color:var(--ink-600);text-align:center;padding:20px}
body.ehr-open #mapctl,body.ehr-open #rail,body.ehr-open #next{opacity:0;pointer-events:none}
#mapctl,#rail,#next{transition:opacity 200ms}
#thread.empty{display:none}
.thead{position:sticky;top:-18px;margin:-18px -18px 0;padding:12px 18px 10px;background:#fff;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;z-index:2;border-radius:18px 18px 0 0}
.thead span{font-family:var(--loud);font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-600)}
.tclose{border:0;background:transparent;font-weight:600;font-size:13px;color:var(--ink-600);cursor:pointer;padding:4px 8px;border-radius:8px}
.tclose:hover{background:var(--paper);color:var(--ink)}
#brief:empty,#notice:empty{display:none}
.bcard{background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--lift);padding:16px 18px;display:flex;flex-direction:column;gap:8px;animation:rise 300ms var(--ease)}
.bcard .bt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bcard .bt b{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.05}
.bcard p{margin:0;color:var(--ink-600);font-size:14px}
.bcard p b{color:var(--ink)}
.bx{border:0;background:transparent;width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--ink-400);flex:0 0 auto}
.bx:hover{background:var(--paper);color:var(--ink)}
#notice .msg.nudge{background:#fff;box-shadow:var(--lift);margin:0}

function audienceMsg(s){

  if(/\b(women|woman|female|ladies)\b/.test(s)){F.sex="F";touched=true;}else if(/\b(men|man|male|guys)\b/.test(s)){F.sex="M";touched=true;}

  if(lo!=null){F.ages=AGEB.filter(function(b){return b[1]>=lo&&b[0]<=hi;});touched=true;}
  if((m=s.match(/\$?\s*(\d{2,3})\s*k\b/))&&/income|make|earn|household|\$|k\b/.test(s)){var v=+m[1];F.inc=v>=250?250:v>=150?150:v>=100?100:0;touched=true;}

  h+='<div class="ta-label">Ask LAIR OS</div><button class="ta-row" data-tq="'+esc(q.value)+'"><span class="ta-ic">✦</span><span>“'+esc(q.value)+'”</span></button>';

/* ---------- Clicks ---------- */
document.addEventListener("click",function(e){
  var t=e.target;

  if(tr){ta.classList.remove("on");q.value="";if(tr.dataset.tp!=null){var p0=NAMED[+tr.dataset.tp];userMsg(p0.name);ask("Open "+p0.name,{silent:true});}else ask(tr.dataset.tq);return;}
  if(!t.closest(".searchbox"))ta.classList.remove("on");
  var rail=t.closest("[data-rail]");if(rail){var a=TODAY[+rail.dataset.rail],pp=P(a.who);if(pp){openPatient(pp.id);botSay("desk",'Opened <b>'+esc(pp.name)+'</b>, '+hm(a.m)+' · '+esc(a.what)+'.');}else meetingMsg(a);return;}
  var op=t.closest("[data-open]");if(op){resolveNudge(op);var po=NAMED[+op.dataset.open];ask("Prep me for my "+(apptOf(po.name)?hmShort(apptOf(po.name).m):"next appointment"),{silent:false});return;}

  var dm=t.closest("[data-dismiss]");if(dm){resolveNudge(dm);return;}
  var ak=t.closest("[data-ask]");if(ak){resolveNudge(ak);ask(ak.dataset.ask);return;}
  var bk=t.closest("[data-book]");if(bk){var pb=NAMED[+bk.dataset.book],slot=bk.dataset.slot;var card=bk.closest(".cs")||bk.parentNode;card.innerHTML='<div class="cardx"><h4>Book '+esc(pb.name)+'</h4><div class="rowx">'+avatar(pb.name)+'<div class="g"><b>'+esc(slot)+'</b><small>'+esc(pb.tx)+'</small></div></div><div class="btns"><button class="btn" data-confirmbook="'+pb.id+'" data-slot="'+esc(slot)+'">Confirm and text '+esc(first(pb))+'</button><button class="btn ghost" data-cancel>Cancel</button></div></div>';return;}
  var cb=t.closest("[data-confirmbook]");if(cb){var pc=NAMED[+cb.dataset.confirmbook];cb.closest(".cardx").innerHTML='<div class="ok"><b>Booked</b> '+esc(pc.name)+', '+esc(cb.dataset.slot)+'. Confirmation text sent (demo).</div>';return;}
  var sd=t.closest("[data-send]");if(sd){var ps=NAMED[+sd.dataset.send],box=sd.closest(".cardx"),ta2=box.querySelector("textarea"),body=ta2?ta2.value.trim():"";if(!body){ta2.focus();say("The message is empty.");return;}box.innerHTML='<div class="ok"><b>Sent</b> to '+esc(ps.name)+' at '+hm(nowMin())+' (demo). “'+esc(body.slice(0,90))+(body.length>90?'…':'')+'”</div>';resolveNudge(box);return;}
  var cn=t.closest("[data-cancel]");if(cn){var bx=cn.closest(".cardx")||cn.closest(".cs")||cn.parentNode;bx.innerHTML='<div class="meta">Cancelled. Nothing was sent or changed.</div>';return;}
  var ac=t.closest("[data-act]");
  if(ac){e.preventDefault();var k=ac.dataset.act,pa=ac.dataset.p!=null?NAMED[+ac.dataset.p]:null;resolveNudge(ac);
    if(k==="text"&&pa){reply("desk",["Drafting a text to "+esc(first(pa))],"Here is a draft. Edit anything before you send.",draftCard(pa,ac.dataset.tpl));return;}
    if(k==="email"&&pa){reply("desk",[],"Here is a draft email.",draftCard(pa,null,"email"));return;}
    if(k==="call"&&pa){actionMsg("call",pa,"");return;}
    if(k==="book"&&pa){actionMsg("book",pa,"");return;}
    if(k==="charge"&&pa){actionMsg("charge",pa,"");return;}
    if(k==="sendform"&&pa){pa.f.consentMissing=false;reply("clin",[],'Consent form texted to <b>'+esc(pa.name)+'</b> (demo). I\'ll let you know when it\'s signed.',"");setTimeout(function(){postNudge("clin",'<b>'+esc(pa.name)+'</b> signed the consent form.','<button class="btn ghost" data-dismiss>OK</button>');renderRail();},14000);renderRail();return;}
    if(k==="newpt"){newPatientMsg(ac.dataset.name);return;}
    if(k==="clearf"){clearF();setHL(null);syncCtl();say("Filters cleared");return;}
    if(k==="reach"){var cc=fCount();reply("grow",["Building an audience of "+fmt(cc.not)+" people"],'Audience ready: <b>'+fmt(cc.not)+' people</b>, '+esc(fDesc())+'. Pick how to reach them. Nothing goes out until you approve it.',
      '<div class="cardx"><h4>Channels</h4><label class="tog"><input type="checkbox" checked> Instagram and Facebook ads to this audience</label><label class="tog"><input type="checkbox" checked> Google ads in their neighborhoods</label><label class="tog"><input type="checkbox"> Postcards to their homes</label><div class="btns"><button class="btn" data-act="launch">Draft the campaign</button><button class="btn ghost" data-cancel>Cancel</button></div></div>');return;}
    if(k==="addaud"){say("Added to your saved audience (demo).");return;}
    var M={dial:"Calling "+(pa?pa.name:"")+" through QUO (demo).",move:(pa?pa.name:"")+" moved to 4:15. Ana is notified (demo).",tellstaff:"Ana is notified (demo).",launch:"Campaign drafted. Review the ads before anything goes live.",order:"Order drafted for review. Nothing is sent until you approve.",invite:"Interview invite drafted for "+(ac.dataset.n||"")+".",bulktext:"Drafted a text for "+(ac.dataset.n||"")+" patients. Review it before sending.",lotnotice:"Notice drafted for "+(ac.dataset.n||"")+" patients. Review before sending.",docancel:(pa?pa.name:"")+"'s appointment cancelled. Waitlist notified (demo).",docharge:"Charged $"+(ac.dataset.n||"")+" to "+(pa?pa.name:"")+"'s card (demo).",reply:"Reply approved and posted (demo).",savept:"New patient saved and intake forms sent (demo)."};
    if(/^(docancel|docharge|savept)$/.test(k)){var b2=ac.closest(".cardx")||ac.closest(".cs")||ac.parentNode;b2.innerHTML='<div class="ok">'+esc(M[k])+'</div>';return;}
    say(M[k]||"Done (demo)");return;}
  var pr=t.closest(".rowx[data-p]");if(pr){var px=NAMED[+pr.dataset.p];openPatient(px.id);botSay("clin",'Opened <b>'+esc(px.name)+'</b>.');return;}
});
$("#mic").onclick=function(){say("Voice input isn't available in this demo. Type your question instead.");};

/* ---------- People filters ---------- */
function syncCtl(){
  $$("#fWho button").forEach(function(b){b.classList.toggle("on",b.dataset.who===F.who);});
  $$("#fSex .fc").forEach(function(b){b.classList.toggle("on",b.dataset.sex===F.sex);});
  $$("#fInc .fc").forEach(function(b){b.classList.toggle("on",+b.dataset.inc===F.inc);});
  $$("#fAge .fc").forEach(function(b,i){b.classList.toggle("on",i===0?!F.ages.length:F.ages.some(function(x){return x[2]===AGEB[i-1][2];}));});
  $("#fOwn").checked=F.own;$("#fSrch").checked=F.srch||!!F.treat;$("#fLook").checked=F.look;
  var c=fCount();
  var nAct=(F.who!=="all"?1:0)+(F.sex!=="all"?1:0)+(F.ages.length?1:0)+(F.inc?1:0)+(F.own?1:0)+(F.srch||F.treat?1:0)+(F.look?1:0)+(F.city?1:0);
  $("#fN").textContent=nAct||"";$("#fN").classList.toggle("show",!!nAct);
  $("#legend").innerHTML=(anyF()?'<span class="fl" title="'+esc(fDesc())+'">'+esc(fDesc().length>48?fDesc().slice(0,46)+"…":fDesc())+'<button data-act="clearf" aria-label="Clear filters">✕</button></span><span><b>'+fmt(c.m)+'</b> match</span>':'<span><b>'+fmt(POP.length)+'</b> people</span>')+
    (F.who!=="not"?'<span><i style="background:#1F4FE0"></i>'+fmt(c.pt)+' patients</span>':'')+(F.who!=="patients"?'<span><i style="background:#96A0AF"></i>'+fmt(c.not)+' not yet</span>':'')+(c.not&&anyF()?'<button class="btn" data-act="reach" style="height:30px;font-size:12px">Reach them</button>':'');
  $("#fRes").innerHTML='<div><span class="num">'+fmt(c.m)+'</span> people'+(anyF()?' match':'')+'</div><div class="row2">'+(F.who==="not"?'<span>None have been in yet</span>':F.who==="patients"?'<span>All are your patients</span>':'<span><b>'+fmt(c.pt)+'</b> patients</span><span><b>'+fmt(c.not)+'</b> not yet</span>')+'</div><div class="meta" style="margin-bottom:6px">'+esc(fDesc())+'</div>'+
    '<div class="btns">'+(c.not?'<button class="btn" data-act="reach" style="height:32px;font-size:12px">Reach the '+fmt(c.not)+'</button>':'')+(anyF()?'<button class="btn ghost" data-act="clearf" style="height:32px;font-size:12px">Clear</button>':'')+'</div>';
  render();
}
$("#fAge").innerHTML='<button class="fc on" data-age="-1">Any</button>'+AGEB.map(function(b,i){return '<button class="fc" data-age="'+i+'">'+b[2]+'</button>';}).join("");
$("#fWho").onclick=function(e){var b=e.target.closest("button");if(!b)return;F.who=b.dataset.who;syncCtl();};
$("#fSex").onclick=function(e){var b=e.target.closest(".fc");if(!b)return;F.sex=b.dataset.sex;syncCtl();};
$("#fInc").onclick=function(e){var b=e.target.closest(".fc");if(!b)return;F.inc=+b.dataset.inc;syncCtl();};
$("#fAge").onclick=function(e){var b=e.target.closest(".fc");if(!b)return;var i=+b.dataset.age;if(i<0)F.ages=[];else{var g=AGEB[i],has=F.ages.some(function(x){return x[2]===g[2];});F.ages=has?F.ages.filter(function(x){return x[2]!==g[2];}):F.ages.concat([g]);}syncCtl();};

$("#fSrch").onchange=function(){F.srch=this.checked;if(!this.checked)F.treat=null;syncCtl();};

function toggleFilters(open){var el=$("#mapctl"),o=open==null?el.classList.contains("hidden"):open;el.classList.toggle("hidden",!o);$("#filterBtn").classList.toggle("on",o);$("#filterBtn").setAttribute("aria-expanded",String(o));}

document.addEventListener("keydown",function(e){if(e.key==="Escape")toggleFilters(false);});
function clearF(){F={who:"all",ages:[],sex:"all",inc:0,own:false,srch:false,look:false,city:null,treat:null};}
function personClick(o){
  var desc=(o.sex==="F"?"Woman":"Man")+", "+o.age+", "+o.city;
  if(o.st)return botSay("desk",'<b>'+esc(desc)+'</b>. '+STATUS[o.st].label+'. In the full system this opens their chart.',"");

    '<div class="btns"><button class="btn" data-act="addaud">Add to an audience</button></div>');

})();
