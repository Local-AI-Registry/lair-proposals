<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LAIR Commission Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Cormorant:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1F4FE0;--ink:#0B1A2E;--coral:#FF5A3C;--paper:#F4F1EA;--line:#DDD7CA;--muted:#5A6577;--soft:#E9EEFC}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45;color-scheme:light}
  h1,h2,p,li,.opt{text-wrap:pretty}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px}
  .concept{background:#FFF7E0;border:1px solid #E9D48A;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:14px}
  .concept b{font-family:"Bricolage Grotesque",sans-serif;display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;color:#7A5B00}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  h1{font-family:"Cormorant",serif;font-weight:700;font-size:34px;line-height:1.05;margin:4px 0 14px}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
  .step-label{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
  .q{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700;line-height:1.2;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .pill{display:inline-block;background:var(--soft);color:var(--blue);font-weight:700;font-size:13px;padding:3px 9px;border-radius:99px;margin-bottom:10px}
  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .opt{text-align:left;font:inherit;font-size:15px;font-weight:600;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .opt small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
  .opt .r{color:var(--blue);font-weight:800;white-space:nowrap}
  .opt.on{border-color:var(--blue);background:var(--soft);box-shadow:inset 0 0 0 1px var(--blue)}
  label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .addrow{display:flex;gap:8px}
  input[type=text],input[type=number]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  input:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--blue);background:var(--blue);color:#fff;white-space:nowrap}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600}
  .chip label{font-weight:500;font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
  .chip button{border:none;background:#fff;border-radius:99px;width:24px;height:24px;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
  .empty{color:var(--muted);font-size:14px;margin-top:10px}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  .res{background:var(--ink);color:#fff;border-color:var(--ink)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
  @media(max-width:480px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:rgba(255,255,255,.07);border-radius:10px;padding:11px}
  .kpi .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;line-height:1.1}
  .kpi .k{font-size:12px;color:#B9C3D6;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{text-align:left;font-size:11px;font-weight:600;color:#B9C3D6;text-transform:uppercase;letter-spacing:.05em;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.15)}
  th.n,td.n{text-align:right;white-space:nowrap;padding-left:8px}
  td{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
  td .why{display:block;font-size:12px;color:#B9C3D6}
  tr.house td{color:#B9C3D6}
  .flag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:12px}
  .flag.ok{background:#E3F5EA;color:#146B3A}.flag.bad{background:#FFE6E0;color:#B3301A}
  .rules{font-size:14px;color:var(--muted);margin-top:16px}
  .rules h3{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;color:var(--ink);margin:0 0 6px}
  .rules li{margin-bottom:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="concept"><b>Concept draft for discussion</b>This is an early idea, not a final compensation plan. Names and numbers are examples only. Nothing on this page changes anyone's current pay or any past deal.</div>
  <div class="brand">Local AI Registry</div>
  <h1>Who earns what on this deal?</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="step-label"><span id="stepNum"></span><span id="running"></span></div>
  <div id="screen"></div>
</div>

<script>
(function(){
  const CAP = 25;
  const SOURCES = [
    {id:"cold",  label:"Cold outreach",                 hint:"They found and contacted the business themselves", rate:5},
    {id:"warm",  label:"Warm lead or personal network", hint:"Someone they already knew, or a referral to them",    rate:5},
    {id:"event", label:"Conference or event LAIR paid for", hint:"Booth, sponsorship or event LAIR covered",      rate:2},
    {id:"kol",   label:"Aneesh, a KOL or a partner",    hint:"Their relationship or introduction brought them in", rate:15}
  ];
  const PHASES = [
    {key:"book",   q:"Who booked the meeting?",          sub:"Whoever got a time on the calendar.",                        rate:2},
    {key:"attend", q:"Who attended the meeting?",        sub:"Everyone from LAIR who was on the call or in the room.",      rate:1},
    {key:"demo",   q:"Who ran the demo?",                sub:"Whoever presented LAIR and answered the questions.",          rate:3},
    {key:"close",  q:"Who chased down the signature?",   sub:"Whoever followed up until the contract was signed.",          rate:4}
  ];
  const st = { step:0, source:null, people:{source:[],book:[],attend:[],demo:[],close:[]}, price:5000, months:12, cogs:50 };
  const TOTAL_STEPS = 2 + PHASES.length + 1; // source type, source who, phases, deal, then results
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const money = n => "$"+Math.round(n).toLocaleString("en-US");
  const pct = n => (Math.round(n*100)/100).toString()+"%";

  function srcObj(){ return SOURCES.find(s=>s.id===st.source); }

  function compute(){
    const lines = new Map(); let total = 0;
    const credit = (p, rate, why) => {
      if(p.house) return; // house keeps it
      const k = p.name.trim().toLowerCase();
      if(!lines.has(k)) lines.set(k,{name:p.name.trim(), rate:0, why:[]});
      const e = lines.get(k); e.rate += rate; e.why.push(why);
    };
    const s = srcObj();
    if(s && st.people.source.length){
      const each = s.rate/st.people.source.length;
      st.people.source.forEach(p=>credit(p, each, (s.id==="kol"?"KOL/partner intro":"Found them")+" "+pct(each)));
    }
    PHASES.forEach(ph=>{
      const list = st.people[ph.key];
      if(!list.length) return;
      const each = ph.rate/list.length;
      const short = {book:"Booked",attend:"Attended",demo:"Demo",close:"Got it signed"}[ph.key];
      list.forEach(p=>credit(p, each, short+" "+pct(each)));
    });
    lines.forEach(e=> total += e.rate);
    // enforce cap by scaling down if somehow over
    if(total > CAP){ const f = CAP/total; lines.forEach(e=>e.rate*=f); total = CAP; }
    return {lines:[...lines.values()], total};
  }

  function header(){
    const n = Math.min(st.step, TOTAL_STEPS);
    $("bar").style.width = (n/TOTAL_STEPS*100)+"%";
    $("stepNum").textContent = st.step < TOTAL_STEPS ? "Step "+(st.step+1)+" of "+TOTAL_STEPS : "Results";
    $("running").textContent = st.step>0 ? "Running total: "+pct(compute().total)+" of "+CAP+"%" : "";
  }

  function peopleBox(key, label, allowHouse){
    const list = st.people[key];
    return '<label class="l">'+label+'</label>'+
      '<div class="addrow"><input type="text" id="nm" placeholder="Type a name and tap Add" autocomplete="off"><button class="btn" id="addBtn" type="button">Add</button></div>'+
      '<div class="chips">'+ (list.length? list.map((p,i)=>
        '<span class="chip">'+esc(p.name)+
        (allowHouse?'<label><input type="checkbox" data-h="'+i+'" '+(p.house?"checked":"")+'>founder</label>':'')+
        '<button type="button" data-rm="'+i+'" aria-label="Remove">&times;</button></span>').join("") : '') +'</div>'+
      (list.length? '' : '<div class="empty">Nobody yet. If nobody did this step, skip it and LAIR keeps that share.</div>')+
      (list.length>1? '<div class="empty">Split evenly between '+list.length+' people.</div>' : '');
  }

  function wirePeople(key){
    const add = ()=>{ const v=$("nm").value.trim(); if(!v) return; st.people[key].push({name:v, house:false}); render(); setTimeout(()=>$("nm")&&$("nm").focus(),0); };
    $("addBtn").onclick = add;
    $("nm").onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ st.people[key].splice(+b.dataset.rm,1); render(); });
    document.querySelectorAll("[data-h]").forEach(c=>c.onchange=()=>{ st.people[key][+c.dataset.h].house=c.checked; header(); });
  }

  function nav(canNext, nextLabel){
    return '<div class="nav">'+(st.step>0?'<button class="btn ghost" id="back" type="button">Back</button>':'<span></span>')+
      '<button class="btn" id="next" type="button" '+(canNext?'':'disabled style="opacity:.4;cursor:default"')+'>'+(nextLabel||"Next")+'</button></div>';
  }
  function wireNav(){
    if($("back")) $("back").onclick=()=>{ st.step--; render(); };
    if($("next")) $("next").onclick=()=>{ st.step++; render(); };
  }

  const founderNote = '<p class="sub" style="margin-top:12px">Tick "founder" for anyone whose share should stay with LAIR, like a founder with equity.</p>';

  function render(){
    header();
    const sc = $("screen"); let h = "";
    if(st.step===0){
      h = '<div class="card"><p class="q">Where did this client come from?</p><p class="sub">Pick the one that best describes how they first came in.</p><div class="opts">'+
        SOURCES.map(s=>'<button class="opt'+(st.source===s.id?' on':'')+'" data-s="'+s.id+'" type="button"><span>'+s.label+'<small>'+s.hint+'</small></span><span class="r">'+s.rate+'%</span></button>').join("")+
        '</div>'+nav(!!st.source)+'</div>';
      sc.innerHTML = h;
      document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ st.source=b.dataset.s; render(); });
      wireNav(); return;
    }
    if(st.step===1){
      const s = srcObj();
      const q = s.id==="kol" ? "Which KOL or partner brought them in?" : s.id==="event" ? "Who worked the lead at the event?" : "Who found them?";
      h = '<div class="card"><span class="pill">'+s.rate+'% for this step</span><p class="q">'+q+'</p><p class="sub">'+
        (s.id==="kol" ? "Aneesh, KOLs and partners get 15% when their relationship brings the client in." : s.id==="event" ? "LAIR paid for the event, so finding credit is smaller. Booking, demo and closing still pay in full." : "Add one or more people.")+
        '</p>'+peopleBox("source","Name",true)+founderNote+nav(true, st.people.source.length?"Next":"Skip")+'</div>';
      sc.innerHTML = h; wirePeople("source"); wireNav(); return;
    }
    const pi = st.step-2;
    if(pi < PHASES.length){
      const ph = PHASES[pi];
      h = '<div class="card"><span class="pill">'+ph.rate+'% for this step</span><p class="q">'+ph.q+'</p><p class="sub">'+ph.sub+' Add more than one if it was shared.</p>'+
        peopleBox(ph.key,"Name",true)+nav(true, st.people[ph.key].length?"Next":"Skip")+'</div>';
      sc.innerHTML = h; wirePeople(ph.key); wireNav(); return;
    }
    if(st.step === 2+PHASES.length){
      h = '<div class="card"><p class="q">About the deal</p><p class="sub">Commission is paid on what the client actually pays, after any discount.</p><div class="grid">'+
        '<div><label class="l" for="price">Monthly price collected ($)</label><input id="price" type="number" inputmode="decimal" min="0" step="100" value="'+st.price+'"></div>'+
        '<div><label class="l" for="months">Months commission is paid</label><input id="months" type="number" inputmode="numeric" min="1" value="'+st.months+'"></div>'+
        '<div><label class="l" for="cogs">Delivery cost (% of price)</label><input id="cogs" type="number" inputmode="decimal" min="0" max="100" value="'+st.cogs+'"></div>'+
        '</div>'+nav(true,"See results")+'</div>';
      sc.innerHTML = h;
      ["price","months","cogs"].forEach(id=>$(id).oninput=e=>{ st[id]=parseFloat(e.target.value)||0; });
      wireNav(); return;
    }
    // results
    const {lines,total} = compute();
    const price = Math.max(0,st.price), months = Math.max(1,st.months), cogs = Math.min(100,Math.max(0,st.cogs));
    const comm = price*total/100, gross = price*(1-cogs/100), keep = gross-comm;
    const rows = lines.map(e=>'<tr><td>'+esc(e.name)+'<span class="why">'+e.why.join(" · ")+'</span></td><td class="n">'+pct(e.rate)+'</td><td class="n">'+money(price*e.rate/100)+'</td><td class="n">'+money(price*e.rate/100*months)+'</td></tr>').join("");
    h = '<div class="card res"><div class="kpis">'+
      '<div class="kpi"><div class="v">'+pct(total)+'</div><div class="k">Total commission</div></div>'+
      '<div class="kpi"><div class="v">'+money(comm)+'</div><div class="k">Paid out per month</div></div>'+
      '<div class="kpi"><div class="v">'+money(comm*months)+'</div><div class="k">Paid out over '+months+' months</div></div>'+
      '<div class="kpi"><div class="v">'+money(keep)+'</div><div class="k">LAIR keeps per month</div></div>'+
      '<div class="kpi"><div class="v">'+(price?pct(Math.round(keep/price*1000)/10):"0%")+'</div><div class="k">LAIR margin during term</div></div>'+
      '<div class="kpi"><div class="v">'+(price?pct(Math.round(gross/price*1000)/10):"0%")+'</div><div class="k">LAIR margin after term</div></div>'+
      '</div><table><thead><tr><th>Person</th><th class="n">Rate</th><th class="n">Month</th><th class="n">Term</th></tr></thead><tbody>'+
      (rows || '<tr><td colspan="4">Nobody added yet.</td></tr>')+
      '<tr class="house"><td>LAIR<span class="why">After delivery cost and commission</span></td><td class="n">'+(price?pct(Math.round(keep/price*1000)/10):"0%")+'</td><td class="n">'+money(keep)+'</td><td class="n">'+money(keep*months)+'</td></tr>'+
      '</tbody></table>'+
      (keep<0?'<span class="flag bad">LAIR loses money during the term</span>':'<span class="flag ok">Within the '+CAP+'% cap</span>')+
      '<div class="nav"><button class="btn ghost" id="back" type="button">Back</button><button class="btn ghost" id="restart" type="button">Start over</button></div></div>'+
      '<div class="rules"><h3>How the shares work</h3><ul>'+
      '<li><b>Where they came from:</b> cold or warm 5%, LAIR-paid event 2%, Aneesh, a KOL or a partner 15%.</li>'+
      '<li><b>Booked the meeting</b> 2%, <b>attended</b> 1%, <b>ran the demo</b> 3%, <b>chased the signature</b> 4%.</li>'+
      '<li>If several people share a step, they split that step evenly. One person can earn across several steps.</li>'+
      '<li>Any step nobody did, or a founder did, stays with LAIR.</li>'+
      '<li>The most any deal pays out is 25%. Paid monthly on cash collected.</li></ul></div>';
    sc.innerHTML = h;
    $("back").onclick=()=>{ st.step--; render(); };
    $("restart").onclick=()=>{ st.step=0; st.source=null; Object.keys(st.people).forEach(k=>st.people[k]=[]); render(); };
  }
  render();
})();
</script>
</body>
</html>
